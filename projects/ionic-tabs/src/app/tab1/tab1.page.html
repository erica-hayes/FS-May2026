<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>Books</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">Books</ion-title>
    </ion-toolbar>
  </ion-header>

  <ion-card *ngFor="let book of books">
    <img [alt]="book.name + ' cover'" [src]="book.logo" />
    <ion-card-header>
      <ion-card-title>{{ book.name }}</ion-card-title>
      <ion-card-subtitle>{{ book.genre }}</ion-card-subtitle>
    </ion-card-header>
    <ion-card-content>
      {{ book.details }}
    </ion-card-content>
  </ion-card>
</ion-content>
